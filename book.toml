[book]
title = "BLVM Documentation"
description = "BLVM node manual, published at docs.btcdecoded.org/blvm/"
authors = ["BTCDecoded Contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
site-url = "/blvm/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/BTCDecoded/blvm-docs"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/BTCDecoded/blvm-docs/edit/main/{path}"
additional-css = ["custom.css"]

[output.html.fold]
enable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.playground]
editable = false
copyable = true

[preprocessor.governance-vars]
command = "mdbook-governance-vars"
after = ["links"]

