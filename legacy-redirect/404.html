<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BLVM documentation moved</title>
    <link rel="canonical" id="canon" href="https://docs.btcdecoded.org/blvm/" />
    <script>
      (function () {
        var path = location.pathname || "/";
        var dest = "https://docs.btcdecoded.org/blvm" + path + location.search + location.hash;
        var canon = document.getElementById("canon");
        if (canon) canon.href = dest;
        var go = document.getElementById("go");
        if (go) go.href = dest;
        location.replace(dest);
      })();
    </script>
  </head>
  <body>
    <p><a id="go" href="https://docs.btcdecoded.org/blvm/">The BLVM manual is now at docs.btcdecoded.org/blvm/</a></p>
  </body>
</html>
